name: Orbeat
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.vibecode
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: UVB62X4VVB
    CODE_SIGN_STYLE: Automatic
targets:
  Orbeat:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: ../Sources/Core
      - path: ../Sources/Ble
      - path: ../Sources/Drivers
    dependencies:
      - target: OrbeatWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Orbeat
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSBluetoothAlwaysUsageDescription: Orbeat reads live heart rate and power from nearby Bluetooth sensors.
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibecode.orbeat.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  OrbeatWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Orbeat
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibecode.orbeat.ios.widget
