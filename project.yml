# One project for both apps. Generate with `xcodegen` (build.sh / ios/deploy.sh do it).
name: Orbeat
options:
  bundleIdPrefix: com.vibecode
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: UVB62X4VVB
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"

# iCloud: one CloudKit container (session history) and one shared key-value
# store (settings) for both apps.
x-icloud: &icloud
  com.apple.developer.icloud-services: [CloudKit]
  com.apple.developer.icloud-container-identifiers: [iCloud.com.vibecode.orbeat]
  com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.vibecode.orbeat

targets:
  OrbeatMac:
    type: application
    platform: macOS
    sources:
      - Sources/Core
      - Sources/Model
      - Sources/Ble
      - Sources/Drivers
      - Sources/UI
      - Sources/Recorder
      - Sources/Fitbit
      - Sources/Mac
      - path: Resources/Orbeat.icns
        buildPhase: resources
    info:
      path: Mac/Info.plist
      properties:
        CFBundleName: Orbeat
        CFBundleDisplayName: Orbeat
        CFBundleIconFile: Orbeat
        LSUIElement: true
        NSBluetoothAlwaysUsageDescription: Orbeat reads live heart rate and power from nearby Bluetooth sensors and talks to Orbeat on your iPhone.
    entitlements:
      path: Mac/Orbeat.entitlements
      properties:
        <<: *icloud
        com.apple.developer.aps-environment: development
    settings:
      base:
        PRODUCT_NAME: Orbeat
        PRODUCT_BUNDLE_IDENTIFIER: com.vibecode.orbeat
        # Not sandboxed: the JSONL log lives in ~/Library/Application Support/Orbeat
        # where an external rsync job reads it.
        ENABLE_HARDENED_RUNTIME: NO

  Orbeat:
    type: application
    platform: iOS
    sources:
      - ios/App
      - ios/Shared
      - Sources/Core
      - Sources/Model
      - Sources/Ble
      - Sources/Drivers
      - Sources/UI
      - Sources/Recorder
    dependencies:
      - target: OrbeatWidget
    info:
      path: ios/App/Info.plist
      properties:
        CFBundleDisplayName: Orbeat
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSBluetoothAlwaysUsageDescription: Orbeat reads live heart rate and power from nearby Bluetooth sensors and talks to Orbeat on your Mac.
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral, remote-notification]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    entitlements:
      path: ios/App/Orbeat.entitlements
      properties:
        <<: *icloud
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibecode.orbeat.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  OrbeatWidget:
    type: app-extension
    platform: iOS
    sources:
      - ios/Widget
      - ios/Shared
    info:
      path: ios/Widget/Info.plist
      properties:
        CFBundleDisplayName: Orbeat
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibecode.orbeat.ios.widget
